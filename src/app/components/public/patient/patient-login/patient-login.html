<div class="login-container">
  <h2>Patient Login</h2>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="Enter email" />
      <small *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">Valid email is required.</small>
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" formControlName="password" placeholder="Enter password" />
      <small *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">Password is required.</small>
    </div>
<div class="login-links">
  <a (click)="goToRegister()">Not able to Login? Register</a>
  <a (click)="goToForgotPassword()">Forgot Password?</a>
</div>
<br>
    <button type="submit" [disabled]="loading">Login</button>
    <div *ngIf="error" class="error">{{ error }}</div>
  </form>
</div>
